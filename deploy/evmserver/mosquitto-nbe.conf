# /etc/mosquitto/conf.d/nbe.conf – host mosquitto, NBE only. (UltraLights' broker is the
# Docker container on :1883 and is untouched.) Every client needs a cert from the NBE
# Device CA; its CN becomes the username that the ACL pins to its own topics.
per_listener_settings false
acl_file /etc/mosquitto/nbe-acl

listener 8884
protocol mqtt
certfile /etc/mosquitto/certs/nbe.evm100.org/fullchain.pem
keyfile  /etc/mosquitto/certs/nbe.evm100.org/privkey.pem
cafile   /etc/mosquitto/certs/nbe-device-ca.crt
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
