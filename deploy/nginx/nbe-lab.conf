# /etc/nginx/sites-available/nbe-lab.conf  ->  ln -s ../sites-available/nbe-lab.conf /etc/nginx/sites-enabled/
# Public HTTPS front for the NBE PPG lab server. Replace ppg.example.org and the upstream address.

upstream nbe_core {
    server 10.0.0.42:8000;          # split layout: the NBE LXC's LAN IP  |  single VM: 127.0.0.1:8000
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ppg.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                        # nginx >= 1.25.1; older: "listen 443 ssl http2;"
    server_name ppg.example.org;

    # certbot --nginx -d ppg.example.org fills these in (or reuse your wildcard cert)
    ssl_certificate     /etc/letsencrypt/live/ppg.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppg.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 5m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /login           { limit_req zone=nbe_login burst=5 nodelay; proxy_pass http://nbe_core; }
    location = /api/auth/token  { limit_req zone=nbe_login burst=5 nodelay; proxy_pass http://nbe_core; }

    # Optional: admin pages only from your tailnet / campus VPN (the nbe_node tool uses /api/nodes,
    # so allow those ranges there too if you enable this).
    # location /admin/ { allow 100.64.0.0/10; deny all; proxy_pass http://nbe_core; }

    location / {
        proxy_pass http://nbe_core;
        proxy_read_timeout 120s;     # big session plots
    }
}
