# /etc/mosquitto/conf.d/nbe.conf – listener for NBE sensor nodes and the NBE server.
#
# Mutual TLS: the broker shows its normal server certificate (your Let's Encrypt cert for
# mqtt.example.org, the same files your lighting listener uses), and every client must present
# a certificate from the NBE Device CA. The certificate CN becomes the MQTT username, which the
# ACL (nbe-acl) uses to pin each node to its own topics. No passwords anywhere.
#
# TLS settings below are per listener, so this doesn't change your existing listeners.
# The ACL file is global unless per_listener_settings is true - see deploy/DEPLOY.md step B3.

listener 8884
protocol mqtt
certfile /etc/mosquitto/certs/mqtt.example.org/fullchain.pem
keyfile  /etc/mosquitto/certs/mqtt.example.org/privkey.pem
cafile   /etc/mosquitto/certs/nbe-device-ca.crt
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
