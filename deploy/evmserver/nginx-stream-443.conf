# /etc/nginx/nbe-stream.conf – :443 shared by the websites and NBE MQTT (installed by enable-mqtt-443.sh,
# included from the main context of nginx.conf). Some networks block :8884; nothing blocks :443.
#
#   :443 ──ssl_preread──┬─ ALPN "mqtt" ──▶ 127.0.0.1:8885 ──▶ mosquitto :8884   (TLS + client cert pass through)
#                       └─ anything else ─▶ 127.0.0.1:8443   (every https server block, PROXY protocol)
#
# nginx only peeks at the ClientHello and never decrypts the MQTT side, so mosquitto still checks the
# node certificates itself. The websites see real client addresses via PROXY protocol + realip
# (conf.d/nbe-proxy-protocol.conf). A new site must listen on "127.0.0.1:8443 ssl proxy_protocol",
# not 443 (certbot --nginx would add "listen 443 ssl"; change it, or re-run enable-mqtt-443.sh).
stream {
    map $ssl_preread_alpn_protocols $nbe_443_backend {
        ~(^|,)mqtt(,|$)  127.0.0.1:8885;
        default          127.0.0.1:8443;
    }

    log_format nbe_mqtt '$remote_addr [$time_local] $status sent=$bytes_sent recv=$bytes_received ${session_time}s';

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $nbe_443_backend;
        proxy_protocol on;
        proxy_timeout 1h;            # idle limit only; HTTP and MQTT keep their own (shorter) timeouts
    }

    # mosquitto 2.0 can't read PROXY protocol: take it off here and log the real client address
    server {
        listen 127.0.0.1:8885 proxy_protocol;
        set_real_ip_from 127.0.0.1;
        access_log /var/log/nginx/nbe-mqtt-443.log nbe_mqtt;
        proxy_pass 127.0.0.1:8884;
        proxy_timeout 1h;
    }
}
