# Managed components (downloaded by `idf.py build` into managed_components/).
# ESP-IDF v6 moved esp-mqtt out of the core into the component registry.
dependencies:
  idf: ">=6.0"
  espressif/mqtt: "*"
  # OV2640 on the XIAO ESP32-S3 Sense (CONFIG_PPG_CAMERA). Uses the new I2C master driver on
  # IDF >= 5.4, so it can share the chip with the MAX30102's i2c_master bus.
  espressif/esp32-camera: "^2.1"
