[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-glasses"
dynamic = ["version"]
description = "NBE smart-glasses: PPG acquisition, data catalog, processing pipeline and lab UI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyserial>=3.5",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
# multi-user server with MQTT nodes (deploy/): web + broker client + certificate authority
server = ["smart-glasses[web]", "paho-mqtt>=2.0", "cryptography>=42"]
dev = ["smart-glasses[server]", "pytest>=7", "httpx2"]  # starlette >= 1.0 TestClient uses httpx2

[project.scripts]
ppg-layer1 = "ppg.cli:main"
ppg-layer2 = "ppg.cli:main2"
sglab = "sglab.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ppg.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sglab = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
