# /etc/nginx/sites-available/nbe.evm100.org  – NBE PPG lab web UI (sglab on 127.0.0.1:8001)

upstream nbe_core {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name nbe.evm100.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                        # nginx >= 1.25.1 (Ubuntu 26.04 ships 1.28); "listen ... http2" is deprecated
    server_name nbe.evm100.org;

    ssl_certificate     /etc/letsencrypt/live/nbe.evm100.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nbe.evm100.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 5m;
    access_log /var/log/nginx/nbe.access.log;
    error_log  /var/log/nginx/nbe.error.log warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /login           { limit_req zone=nbe_login burst=5 nodelay; proxy_pass http://nbe_core; }
    location = /api/auth/token  { limit_req zone=nbe_login burst=5 nodelay; proxy_pass http://nbe_core; }

    # remote processing worker (deploy/worker): uploads Layer 1-2 outputs, long-polls for jobs
    location ^~ /api/worker/ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://nbe_core;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://nbe_core;
        proxy_read_timeout 120s;
    }
}
